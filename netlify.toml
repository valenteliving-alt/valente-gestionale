[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Controllo nuovi lead HubSpot ogni 15 minuti → notifica push
[functions."controlla-lead"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/api/ai-agent"
  to = "/.netlify/functions/ai-agent"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
