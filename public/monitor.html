<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Valente · Chat AI</title>
<meta name="theme-color" content="#1a1915" />
<link rel="manifest" href="/monitor.webmanifest" />
<link rel="apple-touch-icon" href="/monitor-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Chat AI" />
<style>
  :root {
    --bg: #1a1915; --panel: #201f1b; --card: #262521; --card2: #2e2c27; --line: #3a3833;
    --text: #f5f4ee; --muted: #a8a496; --accent: #d97757; --accent-soft: #d9775726;
    --ai: #e8b23a; --ai-soft: #e8b23a22; --ok: #7fb069; --ok-soft: #7fb06922;
    --danger: #c65f5f; --abb: #ff5a5f; --bkg: #003b95; --wa: #25d366;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* ═══ LAYOUT: 1 colonna su telefono, 2 colonne su schermo largo (stile Airbnb) ═══ */
  #app { display: none; height: 100dvh; }
  #app.on { display: flex; }
  #colonna-lista { display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--bg); }
  #colonna-chat { display: none; flex-direction: column; flex: 1; height: 100%; background: var(--panel); border-left: 1px solid var(--line); }
  @media (min-width: 900px) {
    #colonna-lista { width: 400px; min-width: 400px; border-right: 1px solid var(--line); }
    #colonna-chat { display: flex; }
    .indietro { display: none !important; }
  }
  @media (max-width: 899px) {
    body.chat-aperta #colonna-lista { display: none; }
    body.chat-aperta #colonna-chat { display: flex; width: 100%; }
  }

  /* ═══ COLONNA LISTA ═══ */
  .testata { padding: calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .brand h1 { margin: 0; font-size: 20px; font-family: Georgia, serif; letter-spacing: -.3px; }
  .brand h1 em { color: var(--accent); font-style: normal; }
  .stato { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.off { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .cerca { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
  .cerca::placeholder { color: var(--muted); }
  .filtri { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
  .filtri::-webkit-scrollbar { display: none; }
  .fchip { flex-shrink: 0; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fchip .n { opacity: .75; margin-left: 4px; }

  #lista { flex: 1; overflow-y: auto; padding: 8px 10px 30px; }
  .aggiornato { text-align: center; color: var(--muted); font-size: 11px; padding: 6px 0; }
  .card { display: flex; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; }
  .card:hover, .card.sel { background: var(--card); }
  .card.sel { border-color: var(--line); }
  .avatar { position: relative; width: 46px; height: 46px; border-radius: 50%; background: var(--card2);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px;
    color: var(--text); flex-shrink: 0; border: 2px solid var(--line); }
  .avatar.ai-ring { border-color: var(--ai); }
  .avatar.wait-ring { border-color: var(--accent); }
  .canale-dot { position: absolute; bottom: -2px; right: -2px; width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 8px; }
  .c-abb { background: var(--abb); } .c-bkg { background: var(--bkg); } .c-wa { background: var(--wa); } .c-altro { background: var(--muted); }
  .c-info { min-width: 0; flex: 1; }
  .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .nome { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quando { color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .r2 { color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 3px; }
  .anteprima { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .anteprima b { color: var(--text); font-weight: 600; }
  .badge { flex-shrink: 0; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 3px 8px; }
  .b-ai { background: var(--ai-soft); color: var(--ai); border: 1px solid #e8b23a55; }
  .b-wait { background: var(--accent-soft); color: var(--accent); border: 1px solid #d9775755; }
  .b-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid #7fb06944; }
  .vuoto { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; line-height: 1.6; }

  /* ═══ COLONNA CHAT ═══ */
  .chat-top { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; background: var(--panel); }
  .indietro { background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .ct-info { min-width: 0; flex: 1; }
  .ct-nome { font-weight: 800; font-size: 15.5px; }
  .ct-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* pannellino prenotazione (le cose buone di Kross) */
  .preno { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .pchip { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 5px 11px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .pchip.verde { color: var(--ok); border-color: #7fb06955; background: var(--ok-soft); }
  .pchip.oro { color: var(--ai); border-color: #e8b23a55; background: var(--ai-soft); }

  #d-msgs { flex: 1; overflow-y: auto; padding: 16px 14px 24px; }
  .bolla { max-width: 78%; border-radius: 16px; padding: 10px 13px; font-size: 14.5px;
    line-height: 1.45; margin-bottom: 9px; white-space: pre-wrap; word-break: break-word; }
  .da-ospite { background: var(--card2); border: 1px solid var(--line); border-bottom-left-radius: 5px; margin-right: auto; }
  .da-noi { background: #43413a; border: 1px solid #55524a; border-bottom-right-radius: 5px; margin-left: auto; }
  .da-ai { background: #3a3120; border: 1px solid #e8b23a66; border-bottom-right-radius: 5px; margin-left: auto; }
  .tag-ai { display: block; font-size: 10px; font-weight: 800; color: var(--ai); margin-bottom: 4px; letter-spacing: .3px; }

  .suggerita { margin: 6px 0 14px; background: var(--card); border: 1px dashed var(--accent); border-radius: 14px; padding: 12px; }
  .suggerita h4 { margin: 0 0 6px; font-size: 11.5px; color: var(--accent); letter-spacing: .3px; }
  .suggerita textarea { width: 100%; min-height: 100px; background: var(--card2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; line-height: 1.45;
    font-family: inherit; resize: vertical; }
  .azioni { display: flex; gap: 8px; margin-top: 10px; }
  .invia { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 12px;
    font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .invia:disabled { opacity: .6; }
  .copia { flex-shrink: 0; background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 14.5px; cursor: pointer; }
  .in-coda { text-align: center; color: var(--ai); font-size: 13px; font-weight: 700; padding: 10px;
    background: var(--ai-soft); border: 1px solid #e8b23a55; border-radius: 12px; margin: 6px 0 14px; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted);
    font-size: 14px; text-align: center; padding: 30px; }

  /* ═══ LOGIN ═══ */
  #login { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 28px; }
  #login.aperto { display: flex; }
  #login .logo { font-size: 44px; margin-bottom: 8px; }
  #login h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 24px; }
  #login p { margin: 0 0 26px; color: var(--muted); font-size: 13.5px; text-align: center; }
  #login input { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 14px; font-size: 15px; margin-bottom: 10px; }
  #login button { width: 100%; max-width: 340px; background: var(--accent); color: #fff; border: none;
    border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  #login .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div id="login" class="aperto">
  <div class="logo">🤖</div>
  <h2>Valente · <em style="color:var(--accent);font-style:normal">Chat AI</em></h2>
  <p>Le conversazioni con gli ospiti, con l'AI al tuo fianco.<br>Accedi con l'account del CRM.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username" />
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
  <button onclick="fai_login()">Entra</button>
  <div class="err" id="login-err"></div>
</div>

<div id="app">
  <div id="colonna-lista">
    <div class="testata">
      <div class="brand">
        <h1>Valente · <em>Chat AI</em></h1>
        <div class="stato"><span class="dot" id="dot"></span><span id="stato-txt">…</span></div>
      </div>
      <input class="cerca" id="cerca" placeholder="🔍 Cerca ospite o appartamento…" oninput="disegna()" />
      <div class="filtri" id="filtri"></div>
    </div>
    <div id="lista"></div>
  </div>

  <div id="colonna-chat">
    <div class="placeholder" id="d-placeholder">Scegli una conversazione dalla lista 💬</div>
    <div class="chat-top" id="d-top" style="display:none">
      <button class="indietro" onclick="chiudi()">‹</button>
      <div class="ct-info">
        <div class="ct-nome" id="d-nome"></div>
        <div class="ct-sub" id="d-sub"></div>
      </div>
    </div>
    <div class="preno" id="d-preno" style="display:none"></div>
    <div id="d-msgs" style="display:none"></div>
  </div>
</div>

<script>
const SB = "https://heabtbdmwbjlgujsisor.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlYWJ0YmRtd2JqbGd1anNpc29yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjA4NDgsImV4cCI6MjA5NTg5Njg0OH0.FRk1tARhQHylLjfhACorn6O_E7ommm47tBTfJHOVxAU";
let sess = null, chats = [], filtro = "tutte", cfg = {}, selezionata = null, aiMap = {};

function leggiSess() { try { return JSON.parse(localStorage.getItem("vlmon_sess") || "null"); } catch { return null; } }
function salvaSess(s) { localStorage.setItem("vlmon_sess", JSON.stringify(s)); sess = s; }

async function fai_login() {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;
  const el = document.getElementById("login-err"); el.textContent = "";
  try {
    const r = await fetch(`${SB}/auth/v1/token?grant_type=password`, {
      method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: pass }) });
    const j = await r.json();
    if (!r.ok || !j.access_token) { el.textContent = "Email o password non corretti."; return; }
    salvaSess({ at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000 });
    avvia();
  } catch { el.textContent = "Connessione non riuscita. Riprova."; }
}
async function rinnova() {
  if (!sess) return false;
  if (Date.now() < sess.exp) return true;
  try {
    const r = await fetch(`${SB}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: sess.rt }) });
    const j = await r.json();
    if (!r.ok || !j.access_token) return false;
    salvaSess({ at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000 });
    return true;
  } catch { return false; }
}
async function api(path, method, body, prefer) {
  if (!(await rinnova())) { esci(); return null; }
  const r = await fetch(`${SB}/rest/v1/${path}`, {
    method: method || "GET",
    headers: { apikey: ANON, Authorization: `Bearer ${sess.at}`, "Content-Type": "application/json", Prefer: prefer || "return=minimal" },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { esci(); return null; }
  if (method) return r.ok;
  return r.json().catch(() => null);
}
function esci() { localStorage.removeItem("vlmon_sess"); sess = null;
  document.getElementById("login").classList.add("aperto");
  document.getElementById("app").classList.remove("on"); }

/* ── utilità ── */
function tempoFa(ts) {
  if (!ts) return ""; const d = Date.now() - Date.parse(ts);
  const m = Math.floor(d / 60000); if (m < 1) return "adesso"; if (m < 60) return m + " min";
  const h = Math.floor(m / 60); if (h < 24) return h + " h";
  return new Date(ts).toLocaleDateString("it-IT", { day: "numeric", month: "short" });
}
function pulisciNome(n) { return String(n || "?").replace(/\[.*?\]/g, "").trim() || "?"; }
function nomeCorto(a) { return String(a || "n/d").replace(/valente.*$/i, "").trim().slice(0, 48); }
function dataBreve(d) { return d ? new Date(d + "T12:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : ""; }
function soggiorno(c) { const a = dataBreve(c.arrivo), p = dataBreve(c.partenza);
  return a && p ? `${a} → ${p}` : a ? `dal ${a}` : ""; }
function canaleCls(c) { const k = String(c.canale || "").toUpperCase();
  if (k.includes("AIRBNB") || k === "ABB") return ["c-abb", "A"];
  if (k.includes("BOOKING") || k === "BKG") return ["c-bkg", "B"];
  if (k === "WA" || k.includes("WHATS")) return ["c-wa", "W"];
  return ["c-altro", (c.canale || "?").slice(0, 1)]; }
function nAI(c) { return (aiMap[c.id_thread] || []).length || (c.ai_msg_count || 0) || (c.inviata_auto ? 1 : 0); }
function statoChat(c) { if (nAI(c) > 0) return "ai"; if (c.ultimo_ruolo === "ospite") return "wait"; return "ok"; }
function badgeDi(c) {
  const s = statoChat(c);
  if (s === "ai") return ["b-ai", "🤖 AI ×" + nAI(c)];
  if (s === "wait") return ["b-wait", "⏳ attesa"];
  return ["b-ok", "✓"];
}
// una bolla "NOI" è dell'AI se combacia con un intervento registrato
function normalizza(t) { return String(t || "").replace(/\s+/g, " ").trim().toLowerCase().slice(0, 50); }
function eDellAI(c, testo) { return (aiMap[c.id_thread] || []).some(a => normalizza(a) === normalizza(testo) || normalizza(testo).startsWith(normalizza(a).slice(0, 35))); }

/* ── lista ── */
function disegnaFiltri() {
  const conta = { tutte: chats.length, ai: 0, wait: 0, ok: 0 };
  chats.forEach(c => conta[statoChat(c)]++);
  const F = [["tutte", "Tutte"], ["wait", "⏳ In attesa"], ["ai", "🤖 Gestite AI"], ["ok", "✓ Risposte"]];
  document.getElementById("filtri").innerHTML = F.map(([k, l]) =>
    `<button class="fchip ${filtro === k ? "on" : ""}" onclick="setFiltro('${k}')">${l}<span class="n">${conta[k]}</span></button>`).join("");
}
function setFiltro(f) { filtro = f; disegna(); }

function disegna() {
  disegnaFiltri();
  const q = (document.getElementById("cerca").value || "").toLowerCase();
  const vis = chats.filter(c => (filtro === "tutte" || statoChat(c) === filtro) &&
    (!q || ((c.ospite || "") + " " + (c.appartamento || "")).toLowerCase().includes(q)));
  const lista = document.getElementById("lista");
  let html = `<div class="aggiornato">aggiornato ${new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })} · si aggiorna da solo</div>`;
  if (!vis.length) html += `<div class="vuoto">Nessuna conversazione qui.</div>`;
  const st = lista.scrollTop;
  html += vis.map((c) => {
    const s = statoChat(c); const [bcls, btxt] = badgeDi(c);
    const [ccls, cini] = canaleCls(c);
    const nome = pulisciNome(c.ospite);
    const ultima = (c.conversazione || "").split("\n").pop();
    const mia = ultima.startsWith("NOI:");
    const prev = ultima.replace(/^(OSPITE|NOI):\s*/, "");
    const ring = s === "ai" ? "ai-ring" : s === "wait" ? "wait-ring" : "";
    return `<div class="card ${selezionata === c.id_thread ? "sel" : ""}" onclick="apri('${c.id_thread}')">
      <div class="avatar ${ring}">${nome[0].toUpperCase()}<div class="canale-dot ${ccls}"></div></div>
      <div class="c-info">
        <div class="r1"><div class="nome">${nome}</div><div class="quando">${tempoFa(c.ultimo_ts)}</div></div>
        <div class="r2">${nomeCorto(c.appartamento)}${soggiorno(c) ? " · 📅 " + soggiorno(c) : ""}</div>
        <div class="r3"><div class="anteprima">${mia ? "<b>Tu:</b> " : ""}${prev}</div><span class="badge ${bcls}">${btxt}</span></div>
      </div></div>`;
  }).join("");
  lista.innerHTML = html;
  lista.scrollTop = st;
  window._chats = chats;
}

/* ── dettaglio ── */
function apri(id) {
  const c = chats.find(x => x.id_thread === id); if (!c) return;
  selezionata = id;
  document.body.classList.add("chat-aperta");
  document.getElementById("d-placeholder").style.display = "none";
  document.getElementById("d-top").style.display = "flex";
  document.getElementById("d-preno").style.display = "flex";
  document.getElementById("d-msgs").style.display = "block";
  document.getElementById("d-nome").textContent = pulisciNome(c.ospite);
  document.getElementById("d-sub").textContent = nomeCorto(c.appartamento);
  // pannellino prenotazione (stile Kross)
  const righe = (c.conversazione || "").split("\n").filter(r => r.trim());
  const nostre = righe.filter(r => r.startsWith("NOI:"));
  const nostreAI = nostre.filter(r => eDellAI(c, r.replace(/^NOI:\s*/, "")) || (c.inviata_auto && r === righe[righe.length - 1]));
  const tuttaAI = nostre.length > 0 && nostreAI.length === nostre.length && nAI(c) > 0;
  const chips = [];
  if (soggiorno(c)) chips.push(`<span class="pchip">📅 ${soggiorno(c)}</span>`);
  if (c.stato_prenotazione) chips.push(`<span class="pchip verde">✓ ${c.stato_prenotazione}</span>`);
  if (c.canale) chips.push(`<span class="pchip">${c.canale}</span>`);
  if (tuttaAI) chips.push(`<span class="pchip oro">🤖 gestita interamente dall'AI</span>`);
  else if (nAI(c) > 0) chips.push(`<span class="pchip oro">⚡ ${nAI(c)} rispost${nAI(c) === 1 ? "a" : "e"} dell'AI</span>`);
  chips.push(`<span class="pchip">${tempoFa(c.ultimo_ts)} fa</span>`);
  document.getElementById("d-preno").innerHTML = chips.join("");
  // conversazione a bolle (le risposte dell'AI sono evidenziate in ambra)
  const box = document.getElementById("d-msgs");
  let html = righe.map((r, idx) => {
    const mia = r.startsWith("NOI:"); const testo = r.replace(/^(OSPITE|NOI):\s*/, "");
    const ai = mia && (eDellAI(c, testo) || (c.inviata_auto && idx === righe.length - 1));
    if (ai) return `<div class="bolla da-ai"><span class="tag-ai">⚡ INVIATA DALL'AI AL POSTO TUO</span>${testo}</div>`;
    return `<div class="bolla ${mia ? "da-noi" : "da-ospite"}">${testo}</div>`;
  }).join("");
  if (c._inCoda) {
    html += `<div class="in-coda">📤 In invio… parte in meno di un minuto</div>`;
  } else if (c.ultimo_ruolo === "ospite") {
    html += `<div class="suggerita"><h4>🤖 RISPOSTA ${(c.risposta_ai || "").trim() ? "SUGGERITA DALL'AI — modificabile" : "— scrivila tu (l'AI la sta preparando)"}</h4>
      <textarea id="testo-risposta">${(c.risposta_ai || "").replace(/</g, "&lt;")}</textarea>
      <div class="azioni">
        <button class="invia" onclick="inviaMsg(this, '${c.id_thread}')">📤 Invia all'ospite</button>
        <button class="copia" onclick="copia(this)">📋</button>
      </div></div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
  disegna();
}
function chiudi() { document.body.classList.remove("chat-aperta"); selezionata = null; disegna(); }
function copia(btn) {
  const t = document.getElementById("testo-risposta");
  navigator.clipboard.writeText(t ? t.value : "").then(() => {
    btn.textContent = "✓"; setTimeout(() => btn.textContent = "📋", 2000);
  });
}
async function inviaMsg(btn, id) {
  const c = chats.find(x => x.id_thread === id); if (!c) return;
  const t = document.getElementById("testo-risposta");
  const testo = (t ? t.value : "").trim();
  if (!testo) { alert("Scrivi prima la risposta."); return; }
  if (!confirm("Inviare questa risposta all'ospite?")) return;
  btn.disabled = true; btn.textContent = "…";
  const ok = await api("invii_pendenti?on_conflict=id_thread", "POST",
    [{ id_thread: c.id_thread, testo, stato: "in_attesa", creato_il: new Date().toISOString() }],
    "resolution=merge-duplicates,return=minimal");
  if (ok) { c._inCoda = true; apri(id); }
  else { btn.disabled = false; btn.textContent = "📤 Invia all'ospite"; alert("Invio non riuscito, riprova."); }
}

/* ── caricamento ── */
async function carica() {
  const [rc, rcfg, rai] = await Promise.all([
    api("chat_recenti?select=*&order=ultimo_ts.desc.nullslast&limit=20"),
    api("ai_config?id=eq.1&select=*"),
    api("ai_inviati?select=id_thread,testo&order=inviato_il.desc&limit=300"),
  ]);
  if (Array.isArray(rai)) { aiMap = {}; rai.forEach(r => { (aiMap[r.id_thread] = aiMap[r.id_thread] || []).push(r.testo); }); }
  if (Array.isArray(rcfg) && rcfg[0]) cfg = rcfg[0];
  const on = !!cfg.ai_globale_attiva;
  document.getElementById("dot").className = "dot" + (on ? "" : " off");
  document.getElementById("stato-txt").textContent = on ? "AI attiva" : "AI spenta";
  if (Array.isArray(rc)) {
    // ridisegna SOLO se i dati sono cambiati davvero (niente "ballo" ogni 30 secondi)
    const hash = JSON.stringify(rc);
    if (hash === window._hashDati) return;
    window._hashDati = hash;
    const inCoda = new Set(chats.filter(c => c._inCoda).map(c => c.id_thread));
    chats = rc.map(c => ({ ...c, _inCoda: inCoda.has(c.id_thread) && c.ultimo_ruolo === "ospite" }));
    disegna();
    // se la chat aperta ha dati nuovi E non stai scrivendo, aggiornala
    const ta = document.getElementById("testo-risposta");
    const staiScrivendo = ta && document.activeElement === ta;
    if (selezionata && !staiScrivendo) { const c = chats.find(x => x.id_thread === selezionata); if (c) apri(selezionata); }
  }
}
function avvia() {
  document.getElementById("login").classList.remove("aperto");
  document.getElementById("app").classList.add("on");
  carica();
}
sess = leggiSess();
if (sess) avvia();
setInterval(() => { if (sess) carica(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && sess) carica(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/monitor-sw.js", { scope: "/monitor" }).catch(() => {});
</script>
